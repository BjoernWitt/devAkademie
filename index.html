<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Slider</title>
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/slider.css">    
    <link rel="stylesheet" href="./styles/rotator.css">   
    <link rel="stylesheet" href="./styles/keyframes.css">  
    <style>
        body {
            gap: 100px;
        }
    </style>     
</head>
<body>
    <section class="slider_a">
        <input name="slider" type="radio" value="one" checked>
        <input name="slider" type="radio" value="two">
        <input name="slider" type="radio" value="three">

        <div class="slider_a_wrapper">
            <div class="slider_a_element element_one"></div>
            <div class="slider_a_element element_two"></div>            
            <div class="slider_a_element element_three"></div>
        </div>
    </section>

    <section class="slider_b">
        <div class="slider_b_element"></div>
        <div class="slider_b_element"></div>            
        <div class="slider_b_element"></div>
        <div class="slider_b_element"></div>
        <div class="slider_b_element"></div>        
    </section>

    <section class="keyframe">
        <div></div>
    </section>
</body>
</html>
