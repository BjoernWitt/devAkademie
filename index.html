<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Slider</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0px;;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;

            height: 100hv;
        }

        .slider_a {
            position: relative;

            background-color: black;

            width: 250px;
            height: 150px;

            display: flex;
            justify-content: center;
            align-items: flex-end;

            overflow: hidden;
        }

        .slider_a input {
            z-index: 2;
        }

        .slider_a_wrapper {
            z-index: 1;

            width: 300%;
            height: 100%;

            position: absolute;
            display: flex;

            transition: all 1s ease-in-out;
        }

        .slider_a_element {
            width: calc(100% / 3);
            height: 100%;
        }

        .element_one {
            background-color: aquamarine;
        }

        .element_two {
            background-color: brown;
        }

        .element_three {
            background-color: goldenrod;
        }

        .slider_a input[value="one"]:checked~.slider_a_wrapper {
            transform: translateX(calc(100% / 3));
        }

        .slider_a input[value="two"]:checked~.slider_a_wrapper {
            transform: translateX(0);
        }

        .slider_a input[value="three"]:checked~.slider_a_wrapper {
            transform: translateX(calc(-100% / 3));
        }

    </style>
</head>
<body>
    <section class="slider_a">
        <input name="slider" type="radio" value="one" checked>
        <input name="slider" type="radio" value="two">
        <input name="slider" type="radio" value="three">

        <div class="slider_a_wrapper">
            <div class="slider_a_element element_one"></div>
            <div class="slider_a_element element_two"></div>            
            <div class="slider_a_element element_three"></div>
        </div>
    </section>
</body>
</html>
